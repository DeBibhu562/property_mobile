server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web SPA — fall back to index.html for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets; keep index fresh
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
